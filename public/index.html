<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Aaron Shemtov — DevOps Engineer</title>
    <meta
      name="description"
      content="Aaron Shemtov — DevOps Engineer with 14+ years across production engineering, QA, release management and cloud-native delivery."
    />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme") || "light";
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/blueprint.css" />
    <!-- Favicon — the 1ms speedometer logo, shared across all sites. -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <style>
      /* Inline page-specific extensions — kept here rather than in shared
     blueprint.css so a navigation/aside tweak doesn't require shipping
     all four sites together. */

      /* Ribbon subtitle and external indicator — same idiom as infra.1ms.my. */
      .ribbon-nav a > span:first-child {
        display: block;
        line-height: 1.1;
      }
      .ribbon-sub {
        display: block;
        font-family: var(--mono);
        font-size: 9.5px;
        color: var(--mute);
        letter-spacing: 0.04em;
        text-transform: lowercase;
        margin-top: 1px;
      }
      .ribbon-ext {
        margin-left: 4px;
        color: var(--mute);
        font-size: 11px;
        vertical-align: baseline;
      }
      .ribbon-nav a:hover .ribbon-ext,
      .ribbon-nav a:hover .ribbon-sub {
        color: var(--accent);
      }

      /* Footer link list — mirrored from infra so we can reuse the styling. */
      .foot-nav {
        display: flex;
        align-items: flex-end;
        gap: 14px;
        flex-wrap: wrap;
      }
      .foot-nav a {
        display: inline-block;
        font-family: var(--mono);
        font-size: 12px;
        color: var(--mute);
        text-decoration: none;
        transition: color 0.12s ease;
      }
      .foot-nav a:hover,
      .foot-nav a:hover .ribbon-ext,
      .foot-nav a:hover .ribbon-sub {
        color: var(--accent);
      }
      .foot-nav a > span:first-child {
        display: block;
        line-height: 1.1;
      }

      /* Cloud experience aside — same visual language as the platform-spec
     card on infra.1ms.my (grid-paper background, corner brackets, live
     mark) but with prose sections instead of key/value rows.
     Sits sticky on desktop alongside the hero/title block. */
      .cloud-card {
        position: relative;
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 22px 22px 18px;
        background-image:
          linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
          linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
        background-size: 18px 18px;
      }
      .cloud-card::before,
      .cloud-card::after {
        content: "";
        position: absolute;
        width: 14px;
        height: 14px;
        border-color: var(--accent);
        border-style: solid;
        border-width: 0;
      }
      .cloud-card::before {
        top: -1px;
        left: -1px;
        border-top-width: 1.5px;
        border-left-width: 1.5px;
      }
      .cloud-card::after {
        bottom: -1px;
        right: -1px;
        border-bottom-width: 1.5px;
        border-right-width: 1.5px;
      }

      .cloud-card > header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--line);
        padding-bottom: 10px;
        margin-bottom: 14px;
      }
      .cloud-card > header .title-text {
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.12em;
        color: var(--mute);
        text-transform: uppercase;
      }
      .cloud-card .live-mark {
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.08em;
        color: var(--live);
        text-transform: uppercase;
        padding-left: 12px;
        position: relative;
      }
      .cloud-card .live-mark::before {
        content: "";
        position: absolute;
        left: 0;
        top: 50%;
        width: 6px;
        height: 6px;
        transform: translateY(-50%);
        border-radius: 50%;
        background: var(--live);
        box-shadow: 0 0 0 2px color-mix(in oklab, var(--live) 30%, transparent);
      }

      .cloud-section {
        margin-bottom: 14px;
      }
      .cloud-section:last-child {
        margin-bottom: 0;
      }
      .cloud-section h4 {
        font-family: var(--mono);
        font-size: 12.5px;
        font-weight: 600;
        color: var(--accent);
        margin: 0 0 6px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .cloud-section h4 .live-mark-sm {
        font-size: 8.5px;
        padding: 2px 6px;
        border: 1px solid var(--live);
        border-radius: 3px;
        line-height: 1;
        padding-left: 14px;
      }
      .cloud-section h4 .live-mark-sm::before {
        left: 5px;
        width: 5px;
        height: 5px;
      }
      .cloud-section p {
        font-size: 12.5px;
        line-height: 1.55;
        color: var(--ink-2);
        margin: 0;
      }

      /* Profile section becomes a 2-column grid: profile text on the left,
     cloud experience aside on the right. The aside is naturally taller
     than the profile text — that's intentional, the prose just frames
     the technical breadth shown in the aside. */
      .profile-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 360px;
        gap: 32px;
        align-items: start;
      }
      .profile-content {
        min-width: 0;
      }

      /* Stack on narrow screens so the aside falls under the profile text. */
      @media (max-width: 960px) {
        .profile-grid {
          grid-template-columns: 1fr;
        }
        .cloud-card {
          margin-top: 24px;
        }
      }
    </style>
  </head>
  <body>
    <div class="ribbon">

        <div style="display: flex; align-items: center; gap: 18px">

              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <svg
              id="icon-moon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>
        </div>
      </div>
    </div>
