name: one-time-aboutme-rename
on:
  push:
    branches: [rename-aboutme]
permissions:
  contents: write
jobs:
  rename:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename-aboutme
      - name: Rename site identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
            '.github/workflows/build-and-push.yml': [
              ('cv-frontend', 'aboutme-frontend'),
            ],
            'README.md': [
              ('# cv-frontend', '# aboutme-frontend'),
              ('**CV**', '**About Me**'),
              ('cv.1ms.my', 'aboutme.1ms.my'),
            ],
            'public/index.html': [
              ('https://cv.1ms.my/', 'https://aboutme.1ms.my/'),
              ('· cv</span>', '· about me</span>'),
              ('>cv</a>', '>about me</a>'),
              ('<span>cv</span>', '<span>aboutme</span>'),
            ],
          }
          for name, pairs in replacements.items():
              path = Path(name)
              text = path.read_text()
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'{old!r} not found in {name}')
                  text = text.replace(old, new)
              path.write_text(text)
          PY
          rm .github/workflows/rename-aboutme.yml
          git config user.name 'GitHub Actions'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: rename CV site to About Me'
          git push origin HEAD:rename-aboutme
